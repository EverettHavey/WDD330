<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider">
      <div class="logo">
        <img src="../images/noun_Tent_2517.svg" alt="tent image for logo" />
        <a href="../index.html">
          Sleep <span class="highlight">Outside</span>
        </a>
      </div>

      <div class="cart">
        <a href="../cart/index.html">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
             <path d="M18.9 32.6c1.1 2.4 2.5 3.3 5.4 3.3 1.6 0 3.6-0.3 5.9-0.6 3.2-0.5 6.9-1 11.2-1 2.1 0 4.3 0.1 6.4 0.3 2.1 0.1 4.2 0.3 6.1 0.3 3.2 0 5.2-0.4 5.9-1.2 2.7-2.7 2.8-8.8 2.9-14.6 0.1-6.7 0.2-14.5 4.6-18.7 -0.5 0-1 0-1.6 0 -14.2 0-37.5 0-41.1 0C15.6 6.2 14.9 23.6 18.9 32.6z" />
             </svg>
        </a>
      </div>
    </header>

    <main class="divider">
      <section class="checkout-form"> <h2>Review & Place your Order</h2>
        <form name="checkout">
          <fieldset>
            <legend>Shipping Address</legend>
            <label for="fname">First Name</label>
            <input type="text" name="fname" id="fname" required />

            <label for="lname">Last Name</label>
            <input type="text" name="lname" id="lname" required />

            <label for="street">Street Address</label>
            <input type="text" name="street" id="street" required />

            <label for="city">City</label>
            <input type="text" name="city" id="city" required />

            <label for="state">State</label>
            <input type="text" name="state" id="state" required />

            <label for="zip">Zip Code</label>
            <input type="text" name="zip" id="zip" required />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input type="text" name="cardNumber" id="cardNumber" placeholder="1234123412341234" required />

            <label for="expiration">Expiration Date</label>
            <input type="text" name="expiration" id="expiration" placeholder="MM/YY" required />

            <label for="code">Security Code</label>
            <input type="text" name="code" id="code" placeholder="123" required />
          </fieldset>

          <fieldset class="order-summary">
            <legend>Order Summary</legend>
            <ul>
              <li>
                <label>Item Subtotal (<span id="num-items">0</span>)</label>
                <span id="subtotal">$0.00</span>
              </li>
              <li>
                <label>Shipping Estimate</label>
                <span id="shipping">$0.00</span>
              </li>
              <li>
                <label>Tax</label>
                <span id="tax">$0.00</span>
              </li>
              <li>
                <label><strong>Order Total</strong></label>
                <span id="orderTotal">$0.00</span>
              </li>
            </ul>
          </fieldset>

          <button id="checkoutSubmit" type="submit">Checkout</button>
        </form>
      </section>
    </main>

    <footer>&copy;NOT a real business</footer>
  </body>
</html>
