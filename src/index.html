<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <div class="hero">
        <img src="/images/banner-sm.jpg" srcset="images/banner-sm.jpg 500w, images/banner.jpg" alt="image of a high mountain lake" />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>Our mission is to provide you with everything you need to sleep outside comfortably at an affordable price.</p>
        </div>
      </div>

      <section class="category-nav">
        <h2 class="section-title">Shop by Category</h2>
        <div class="category-grid">
          <a href="product_listing/index.html?category=tents" class="category-card">
            <img src="/images/tents.webp" alt="Tents category">
            <p>Tents</p>
          </a>
          <a href="product_listing/index.html?category=backpacks" class="category-card">
            <img src="/images/backpacks.webp" alt="Backpacks category">
            <p>Backpacks</p>
          </a>
          <a href="product_listing/index.html?category=sleeping-bags" class="category-card">
            <img src="/images/sleeping-bags.webp" alt="Sleeping Bags category">
            <p>Sleeping Bags</p>
          </a>
          <a href="product_listing/index.html?category=hammocks" class="category-card">
            <img src="/images/hammocks.webp" alt="Hammocks category">
            <p>Hammocks</p>
          </a>
        </div>
      </section>

      <section class="products">
        <h2>Top Products</h2>
        <ul class="product-list"></ul>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
